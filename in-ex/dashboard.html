<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ILCT 受験者ダッシュボード</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family:"Yu Gothic"; background:#eef2f7; margin:0; }
  .box {
    max-width:600px; margin:60px auto; background:#fff; padding:40px;
    border-radius:12px; box-shadow:0 8px 25px rgba(0,0,0,0.15);
  }
  h2 { text-align:center; margin-bottom:30px; }
  .info-box {
    padding:20px; border:1px solid #ccc; border-radius:8px; margin-bottom:20px;
    background:#fafafa;
  }
  button {
    width:100%; padding:14px; background:#004b9b; color:#fff;
    font-size:20px; border:none; border-radius:8px; cursor:pointer;
    margin-top:20px;
  }
  button:hover { background:#003b7a; }
  .logout-btn { background:#b30000; }
</style>
</head>
<body>

<div class="box">
  <h2>ILCT 受験者ダッシュボード</h2>

  <!-- ▼ 基本情報 -->
  <div class="info-box">
    <h3>あなたの情報</h3>
    <p><strong>氏名：</strong> <span id="name"></span></p>
    <p><strong>メール：</strong> <span id="email"></span></p>
    <p><strong>ログイン方法：</strong> <span id="provider"></span></p>
  </div>

  <!-- ▼ 受験申し込み一覧 -->
  <div class="info-box">
    <h3>受験申し込み一覧</h3>
    <div id="applications"></div>
  </div>

  <button onclick="location.href='profile.html'">プロフィール編集</button>
  <button class="logout-btn" id="logoutBtn">ログアウト</button>
</div>

<script type="module">
  import { auth, db } from "./firebase.js";
  import {
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

  import {
    collection,
    query,
    where,
    getDocs,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  /* ▼ ログインチェック */
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "login.html";
      return;
    }

    // ▼ 基本情報表示
    document.getElementById("name").textContent = user.displayName || "未設定";
    document.getElementById("email").textContent = user.email;
    document.getElementById("provider").textContent = user.providerData[0].providerId;

    // ▼ Firestore の users コレクションから追加情報取得
    const userDoc = await getDoc(doc(db, "users", user.uid));
    if (userDoc.exists()) {
      const data = userDoc.data();
      if (data.name) document.getElementById("name").textContent = data.name;
    }

    // ▼ 受験申し込み一覧取得
    const q = query(
      collection(db, "applications"),
      where("uid", "==", user.uid)
    );

    const snapshot = await getDocs(q);
    const box = document.getElementById("applications");

    if (snapshot.empty) {
      box.innerHTML = "<p>まだ申し込みはありません。</p>";
      return;
    }

    snapshot.forEach(doc => {
      const data = doc.data();
      box.innerHTML += `
        <div style="padding:15px; border:1px solid #ccc; margin-bottom:10px; border-radius:8px;">
          <p><strong>試験名：</strong> ${data.exam_name}</p>
          <p><strong>試験日：</strong> ${data.date}</p>
          <p><strong>ステータス：</strong> ${data.status}</p>
        </div>
      `;
    });
  });

  /* ▼ ログアウト */
  document.getElementById("logoutBtn").onclick = async () => {
    await signOut(auth);
    window.location.href = "login.html";
  };
</script>

</body>
</html>
