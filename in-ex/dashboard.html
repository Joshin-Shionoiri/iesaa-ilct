<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ILCT 受験者ダッシュボード</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; font-family:"Yu Gothic"; background:#eef2f7; }

  .box {
    max-width:900px;
    margin:40px auto;
    background:#fff;
    padding:40px;
    border-radius:12px;
    box-shadow:0 8px 25px rgba(0,0,0,0.15);
  }

  h2 { font-size:28px; margin-bottom:20px; color:#004b9b; }

  table {
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
  }
  th, td {
    border:1px solid #ccc;
    padding:12px;
    font-size:18px;
  }
  th { background:#004b9b; color:#fff; }

  .btn {
    display:inline-block;
    padding:14px 28px;
    margin-top:20px;
    font-size:20px;
    background:#004b9b;
    color:#fff;
    border-radius:8px;
    text-decoration:none;
    transition:0.2s;
  }
  .btn:hover { background:#003b7a; transform:translateY(-3px); }

  footer {
    text-align:center;
    padding:30px;
    margin-top:40px;
    background:#f5f5f5;
    border-top:1px solid #ddd;
  }
  footer a {
    color:#004b9b;
    font-size:18px;
    text-decoration:none;
  }
</style>
</head>
<body>

<div class="box">
  <h2>受験者ダッシュボード</h2>

  <p style="font-size:20px;">
    ここでは、あなたが申し込んだ ILCT の受験情報を確認できます。
  </p>

  <a href="#form" class="btn">受験申し込みフォームを開く</a>

  <h2 style="margin-top:40px;">申込履歴</h2>

  <table id="table">
    <thead>
      <tr>
        <th>氏名</th>
        <th>メール</th>
        <th>試験名</th>
        <th>試験日</th>
        <th>申込日時</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- ▼ Google Forms 埋め込み ▼ -->
<div class="box" id="form">
  <h2>受験申し込みフォーム</h2>

  <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSc3z_rHsyrUm3delOBmAfoyxnTF3omrP2GqU95-AHlIKWY7JQ/viewform?embedded=true"
          width="100%" height="1600" frameborder="0" marginheight="0" marginwidth="0">
    読み込んでいます…
  </iframe>
</div>

<script>
  const data = JSON.parse(localStorage.getItem("applications") || "[]");
  const tbody = document.querySelector("#table tbody");

  if (data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">申込履歴はありません</td></tr>`;
  } else {
    data.forEach(row => {
      tbody.innerHTML += `
        <tr>
          <td>${row.name}</td>
          <td>${row.email}</td>
          <td>${row.exam}</td>
          <td>${row.date}</td>
          <td>${row.timestamp}</td>
        </tr>
      `;
    });
  }
</script>

<footer>
  <a href="kiyaku.html">受験規約（ILCT）</a><br><br>
  <a href="https://www.iesaa.jp/特定商取引法に基づく表記">特定商取引法に基づく表記</a>
</footer>

</body>
</html>
