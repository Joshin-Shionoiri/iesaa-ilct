<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>新規登録｜ILCT</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family:"Yu Gothic"; background:#eef2f7; margin:0; }
  .box {
    max-width:500px; margin:80px auto; background:#fff; padding:40px;
    border-radius:12px; box-shadow:0 8px 25px rgba(0,0,0,0.15);
  }
  h2 { text-align:center; margin-bottom:30px; }
  input {
    width:100%; padding:14px; margin-bottom:20px;
    font-size:18px; border:1px solid #ccc; border-radius:8px;
  }
  button {
    width:100%; padding:14px; background:#004b9b; color:#fff;
    font-size:20px; border:none; border-radius:8px; cursor:pointer;
    margin-bottom:15px;
  }
  button:hover { background:#003b7a; }
  .google-btn { background:#fff; color:#444; border:1px solid #ccc; }
</style>

<!-- 1. SupabaseのJavaScriptライブラリを読み込む -->
<script src="https://jsdelivr.net"></script>
</head>
<body>

<div class="box">
  <h2>新規登録（ILCT 受験者）</h2>

  <!-- ▼ メール登録 -->
  <input id="name" placeholder="氏名">
  <input id="email" placeholder="メールアドレス">
  <input id="password" type="password" placeholder="パスワード（6文字以上）">
  <button id="signupBtn">メールで登録</button>

  <hr style="margin:30px 0;">

  <!-- ▼ Google登録 -->
  <button class="google-btn" id="googleSignupBtn">Googleで登録</button>
</div>

<script>
  // 2. Supabaseの初期化設定
  const SUPABASE_URL = 'https://ivxvxztzdpjeqodhvyaa.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_ti42KqSQWoNeNHdnz_9S6Q_DuvPMqMm';
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /* ▼ メール登録の処理 */
  document.getElementById("signupBtn").onclick = async () => {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!name || !email || !password) {
      alert("すべての項目を入力してください。");
      return;
    }

    try {
      // Supabaseにアカウントを作成（同時にメタデータとして氏名を保存）
      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            display_name: name
          }
        }
      });

      if (error) throw error;

      const user = data.user;

      if (user) {
        // データベースの users テーブルにプロフィール情報を保存
        const { error: dbError } = await supabase
          .from('users')
          .upsert({
            uid: user.uid || user.id, // Supabaseのユーザー識別子(id)
            name: name,
            email: email,
            created_at: new Date().toISOString()
          });

        if (dbError) throw dbError;

        alert('登録確認メールを送信しました。メール内のリンクをクリックして認証を完了してください。');
        window.location.href = "login.html";
      }
    } catch (error) {
      alert("登録エラー: " + error.message);
    }
  };

  /* ▼ Google登録の処理 */
  document.getElementById("googleSignupBtn").onclick = async () => {
    const { data, error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: {
        // ログイン成功後に移動するマイページの絶対URL
        redirectTo: 'https://iesaa.org'
      }
    });

    if (error) {
      alert("Google登録エラー: " + error.message);
    }
  };

  /* ▼ ログイン・認証状態の変更を監視する処理 */
  supabase.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && session) {
      const user = session.user;
      
      // Googleログイン経由などの場合、ここでusersテーブルにデータを自動同期・保存
      const { error: dbError } = await supabase
        .from('users')
        .upsert({
          uid: user.id,
          name: user.user_metadata.full_name || user.user_metadata.display_name || null,
          email: user.email || null,
          provider: user.app_metadata.provider || 'unknown',
          created_at: new Date().toISOString()
        });

      if (!dbError) {
        // 保存に成功、または既にデータがあればマイページへ移動
        window.location.href = "dashboard.html";
      }
    }
  });
</script>

</body>
</html>
