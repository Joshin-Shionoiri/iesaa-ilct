<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ILCT 受験者ポータル｜ログイン</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family:"Yu Gothic"; background:#f5f7fb; margin:0; }
  .box { max-width:420px; margin:80px auto; background:#fff; padding:40px;
         border-radius:12px; box-shadow:0 8px 25px rgba(0,0,0,0.15); }
  h2 { text-align:center; color:#004b9b; margin-bottom:30px; }
  label { font-size:18px; margin-bottom:8px; display:block; }
  input { width:100%; padding:14px; font-size:18px; margin-bottom:20px;
          border:1px solid #ccc; border-radius:8px; }
  button { width:100%; padding:14px; background:#004b9b; color:#fff;
           font-size:20px; border:none; border-radius:8px; cursor:pointer; margin-bottom:20px; }
  .google-btn { background:#fff; color:#444; border:1px solid #ccc; }
  a { display:block; text-align:center; margin-top:10px; color:#004b9b; }
</style>

<!-- SupabaseのJavaScriptライブラリを読み込む -->
<script src="https://jsdelivr.net"></script>
</head>
<body>

<div class="box">
  <h2>ログイン</h2>

  <label>メールアドレス</label>
  <input id="email" type="email">

  <label>パスワード</label>
  <input id="password" type="password">

  <button id="loginBtn">ログイン</button>
  <button class="google-btn" id="googleLoginBtn">Googleでログイン</button>

  <a href="signup.html">新規登録はこちら</a>
  <a href="reset-password.html">パスワードを忘れた方はこちら</a>
</div>

<script>
  // Supabaseの初期化設定
  const SUPABASE_URL = 'https://ivxvxztzdpjeqodhvyaa.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_ti42KqSQWoNeNHdnz_9S6Q_DuvPMqMm';
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /* ▼ メールログインの処理 */
  document.getElementById("loginBtn").onclick = async () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
      alert("メールアドレスとパスワードを入力してください。");
      return;
    }

    const { data, error } = await supabase.auth.signInWithPassword({
      email: email,
      password: password,
    });

    if (error) {
      alert("ログインエラー: " + error.message);
    } else {
      // 同じフォルダ内（in-ex/）のdashboard.htmlに移動
      window.location.href = "dashboard.html";
    }
  };

  /* ▼ Googleログインの処理 */
  document.getElementById("googleLoginBtn").onclick = async () => {
    const { data, error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: {
        // ログイン成功後に移動するマイページの絶対URL（in-ex/を付与）
        redirectTo: 'https://github.io'
      }
    });

    if (error) {
      alert("Googleログインエラー: " + error.message);
    }
  };
</script>

</body>
</html>
